name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run verification suite
        run: make verify

  build-binaries:
    name: Build nightly Linux ${{ matrix.asset_arch }} binary
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
            asset_arch: x86_64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve build metadata
        id: buildmeta
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          {
            echo "version=${version}"
            echo "commit=${GITHUB_SHA:0:12}"
            echo "build_date=${build_date}"
          } >> "$GITHUB_OUTPUT"

      - name: Build nightly binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.buildmeta.outputs.version }}
        run: make build

      - name: Package nightly assets
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          VERSION: ${{ steps.buildmeta.outputs.version }}
        run: |
          set -euo pipefail

          asset_name="crproxy_${VERSION}_linux_${ASSET_ARCH}"
          bundle_root="staging/${asset_name}"
          mkdir -p release "${bundle_root}/systemd"

          install -m 0755 bin/crproxy "release/${asset_name}"
          install -m 0755 bin/crproxy "${bundle_root}/crproxy"
          install -m 0644 LICENSE NOTICE crproxy.example.yaml "${bundle_root}/"
          install -m 0644 deploy/systemd/crproxy.service deploy/systemd/crproxy.sysusers \
            "${bundle_root}/systemd/"
          tar -C staging -czf "release/${asset_name}.tar.gz" "${asset_name}"

          ./bin/crproxy version | tee "release/version_linux_${ASSET_ARCH}.txt"
          test "$(./bin/crproxy version)" = "${VERSION}"

      - name: Upload nightly binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: crproxy-nightly-linux-${{ matrix.asset_arch }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  container:
    name: Publish nightly multi-architecture container image
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image build metadata
        id: buildmeta
        run: |
          set -euo pipefail
          {
            echo "version=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
            echo "commit=${GITHUB_SHA:0:12}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=sha,prefix=sha-,format=short

      - name: Build and push nightly container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
          cache-from: type=gha,scope=crproxy-nightly
          cache-to: type=gha,mode=max,scope=crproxy-nightly

  publish:
    name: Publish rolling nightly release
    needs:
      - build-binaries
      - container
    runs-on: ubuntu-24.04

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crproxy-nightly-linux-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          checksums_tmp="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "${checksums_tmp}"
          mv "${checksums_tmp}" checksums.txt
          ls -lh

      - name: Write nightly release notes
        run: |
          set -euo pipefail
          cat > nightly-release-notes.md <<EOF
          # CRProxy Nightly

          This prerelease is rebuilt by the Nightly workflow and refreshed on every successful run.

          - Commit: [\`${GITHUB_SHA:0:12}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - Branch: \`${GITHUB_REF_NAME}\`
          - Generated at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          - Workflow run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## Container image

          - \`ghcr.io/${GITHUB_REPOSITORY}:nightly\`
          - \`ghcr.io/${GITHUB_REPOSITORY}:nightly-$(date -u +%Y%m%d)\`
          - \`ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA:0:7}\`

          The attachments on this release are replaced on every successful Nightly run.
          EOF
          cat nightly-release-notes.md

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view nightly >/dev/null 2>&1; then
            old_assets="$(mktemp)"
            gh release view nightly --json assets --jq '.assets[].name' > "${old_assets}"

            gh release upload nightly release/* --clobber
            gh release edit nightly \
              --title "Nightly" \
              --notes-file nightly-release-notes.md \
              --draft=false \
              --prerelease \
              --latest=false

            declare -A current_assets=()
            for asset_path in release/*; do
              current_assets["$(basename "${asset_path}")"]=1
            done
            while IFS= read -r asset; do
              if [[ -n "${asset}" && -z "${current_assets[${asset}]:-}" ]]; then
                gh release delete-asset nightly "${asset}" --yes
              fi
            done < "${old_assets}"
            rm -f "${old_assets}"
          else
            gh release create nightly \
              release/* \
              --target "${GITHUB_SHA}" \
              --title "Nightly" \
              --notes-file nightly-release-notes.md \
              --prerelease \
              --latest=false
          fi

          gh release view nightly --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
